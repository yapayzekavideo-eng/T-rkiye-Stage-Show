<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Türkiye Stage Show | TSS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =========================
   HEADER
========================= */

header{
    height:76px;
    padding:0 5%;

    background:#050505;
    border-bottom:1px solid #29230f;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-main{
    color:#d4af37;
    font-size:36px;
    font-weight:900;
    letter-spacing:-2px;
}

.logo-line{
    width:1px;
    height:34px;
    background:#665521;
}

.logo-text{
    color:#aaa;
    font-size:9px;
    line-height:1.1;
    letter-spacing:2px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:27px;
}

nav a{
    font-size:12px;
    font-weight:bold;
    color:#ddd;
    transition:.2s;
}

nav a:hover{
    color:#d4af37;
}

.vote-top{
    border:1px solid #d4af37;
    color:#d4af37;

    padding:11px 20px;

    border-radius:4px;

    font-weight:bold;
    font-size:12px;

    transition:.2s;
}

.vote-top:hover{
    background:#d4af37;
    color:#050505;
}


/* =========================
   MAIN
========================= */

main{
    width:92%;
    max-width:1350px;
    margin:35px auto 80px;
}


/* =========================
   INTRO
========================= */

.intro{
    margin-bottom:25px;
}

.intro small{
    color:#d4af37;
    font-size:11px;
    letter-spacing:4px;
    font-weight:bold;
}

.intro h1{
    font-size:clamp(45px,7vw,85px);
    line-height:.9;
    letter-spacing:-4px;
    margin-top:10px;
}

.intro h1 span{
    color:#d4af37;
}

.intro p{
    color:#888;
    max-width:600px;
    margin-top:18px;
    line-height:1.6;
}


/* =========================
   MOSAIC
========================= */

.mosaic{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    grid-auto-rows:90px;
    gap:12px;
}


/* =========================
   GENERAL CARD
========================= */

.card{
    position:relative;
    overflow:hidden;

    border:1px solid #302a16;
    background:#0d0d0d;

    transition:.3s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#d4af37;

    box-shadow:
        0 15px 40px rgba(212,175,55,.08);
}

.card-content{
    position:absolute;
    inset:0;

    padding:25px;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    background:
        linear-gradient(
            transparent 15%,
            rgba(0,0,0,.9) 100%
        );
}

.card-label{
    color:#d4af37;
    font-size:10px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:8px;
}

.card h2{
    font-size:28px;
    line-height:1;
}

.card p{
    color:#aaa;
    font-size:12px;
    margin-top:8px;
    line-height:1.5;
}


/* =========================
   HERO
========================= */

.hero-card{
    grid-column:span 8;
    grid-row:span 5;

    background:
        radial-gradient(
            circle at 70% 35%,
            rgba(212,175,55,.35),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #181407,
            #080808 65%
        );
}

.hero-card:after{
    content:"TSS";

    position:absolute;

    right:-30px;
    bottom:-80px;

    font-size:250px;
    font-weight:900;

    color:rgba(212,175,55,.035);
}


/* =========================
   NEWS
========================= */

.news-one{
    grid-column:span 4;
    grid-row:span 3;

    background:
        linear-gradient(
            145deg,
            #31260d,
            #090909
        );
}

.news-two{
    grid-column:span 4;
    grid-row:span 2;

    background:
        linear-gradient(
            145deg,
            #252019,
            #090909
        );
}

.news-three{
    grid-column:span 4;
    grid-row:span 2;

    background:
        linear-gradient(
            145deg,
            #211b0d,
            #090909
        );
}


/* =========================
   VOTE
========================= */

.vote-card{
    grid-column:span 4;
    grid-row:span 3;

    background:
        radial-gradient(
            circle at 70% 30%,
            rgba(212,175,55,.28),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #1b1609,
            #080808
        );
}

.vote-card .big-icon{
    font-size:48px;
    margin-bottom:auto;
}

.vote-link{
    display:inline-block;

    margin-top:16px;

    padding:12px 20px;

    background:#d4af37;
    color:#050505;

    font-size:12px;
    font-weight:bold;

    border-radius:3px;

    transition:.2s;
}

.vote-link:hover{
    background:#f0d56a;
}


/* =========================
   ARTISTS
========================= */

.artists-card{
    grid-column:span 8;
    grid-row:span 3;

    background:#0b0b0b;

    cursor:pointer;
}

.artist-mini-grid{
    position:absolute;
    inset:0;

    display:grid;
    grid-template-columns:repeat(3,1fr);
}

.artist-mini{
    position:relative;

    border-right:1px solid #282313;

    overflow:hidden;

    transition:.3s;
}

.artist-mini:last-child{
    border-right:none;
}

.artist-mini:nth-child(1){
    background:
        linear-gradient(
            145deg,
            #514316,
            #080808
        );
}

.artist-mini:nth-child(2){
    background:
        linear-gradient(
            145deg,
            #3f3515,
            #080808
        );
}

.artist-mini:nth-child(3){
    background:
        linear-gradient(
            145deg,
            #66551c,
            #080808
        );
}

.artist-mini span{
    position:absolute;

    left:15px;
    bottom:15px;

    font-size:16px;
    font-weight:900;
}

.artists-overlay{
    position:absolute;
    inset:0;

    padding:22px;

    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    background:
        linear-gradient(
            rgba(0,0,0,.25),
            transparent 45%,
            rgba(0,0,0,.5)
        );
}

.artists-overlay h2{
    font-size:28px;
}

.artists-overlay a{
    color:#d4af37;

    font-size:11px;
    font-weight:bold;

    transition:.2s;
}

.artists-overlay a:hover{
    color:#f0d56a;
}


/* =========================
   AWARDS
========================= */

.awards-card{
    grid-column:span 4;
    grid-row:span 3;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(212,175,55,.22),
            transparent 38%
        ),
        #0d0d0d;
}

.trophy{
    font-size:52px;
    margin-bottom:auto;
}


/* =========================
   BIG NEWS
========================= */

.big-news{
    grid-column:span 8;
    grid-row:span 3;

    background:
        linear-gradient(
            135deg,
            #35290c,
            #090909
        );
}


/* =========================
   SMALL NEWS
========================= */

.small-news{
    grid-column:span 4;
    grid-row:span 3;

    background:
        linear-gradient(
            135deg,
            #211b0d,
            #080808
        );
}


/* =========================
   BOTTOM CTA
========================= */

.bottom-card{
    grid-column:span 12;
    grid-row:span 2;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:35px;

    background:
        linear-gradient(
            100deg,
            #171207,
            #0b0b0b
        );
}

.bottom-card h2{
    font-size:35px;
}

.bottom-card span{
    color:#d4af37;
}

.bottom-button{
    background:#d4af37;
    color:#050505;

    padding:15px 25px;

    font-weight:bold;
    font-size:13px;

    transition:.2s;
}

.bottom-button:hover{
    background:#f0d56a;
}


/* =========================
   FOOTER
========================= */

footer{
    border-top:1px solid #29230f;

    padding:45px 5%;

    background:#030303;
}

.footer-inner{
    max-width:1350px;
    margin:auto;

    display:flex;

    justify-content:space-between;
    align-items:center;
}

.footer-logo{
    color:#d4af37;

    font-size:30px;
    font-weight:900;
}

.footer-text{
    color:#666;

    font-size:12px;
    line-height:1.6;
}

.footer-links{
    display:flex;
    gap:20px;
}

.footer-links a{
    color:#777;

    font-size:11px;

    transition:.2s;
}

.footer-links a:hover{
    color:#d4af37;
}


/* =========================
   TABLET
========================= */

@media(max-width:900px){

    header{
        height:auto;

        padding:17px 5%;

        flex-wrap:wrap;

        gap:15px;
    }

    nav{
        order:3;

        width:100%;

        overflow-x:auto;

        padding-bottom:4px;
    }

    nav a{
        white-space:nowrap;
    }
